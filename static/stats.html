<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pendelmonitor – Vergleich</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/"><img src="/static/img/favicon.svg" alt="" width="28" height="28">Pendelmonitor</a>
  <nav class="topnav" aria-label="Hauptnavigation">
    <a href="/">Strecken</a>
    <a href="/stations">Bahnhöfe</a>
    <a href="/stats" aria-current="page">Vergleich</a>
    <a href="/live" class="live-link">Live</a>
  </nav>
  <div class="updated" id="updated" aria-live="polite"></div>
</div></header>
<main>
  <div class="page-head">
    <div class="grow"><h1 id="title">Vergleich aller Strecken</h1><p class="muted small" id="period-label" style="margin:4px 0 0"></p></div>
    <div class="segmented" role="group" aria-label="Vergleichen" id="tabs">
      <button type="button" data-tab="routes" aria-pressed="true">Strecken</button>
      <button type="button" data-tab="stations" aria-pressed="false">Bahnhöfe</button>
    </div>
  </div>
  <div class="chips" id="periods" role="group" aria-label="Zeitraum"></div>
  <form class="daterange hidden" id="daterange">
    <label>Von<input class="input" type="date" name="from" required></label>
    <label>Bis<input class="input" type="date" name="to" required></label>
    <button class="btn" type="submit">Anwenden</button>
  </form>
  <div class="toolbar">
    <label class="search-field"><span class="sr-only">Strecke suchen</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input class="input" id="route-q" type="search" placeholder="Strecke oder Bahnhof suchen" autocomplete="off" maxlength="60">
    </label>
    <select class="input" id="route-jump" aria-label="Direkt zu einer Strecke"><option value="">Direkt zu Strecke …</option></select>
  </div>
  <p class="muted small" id="route-count" aria-live="polite" style="margin:6px 0 0"></p>
  <div class="sortbar section"><span class="muted small">Sortieren:</span><div class="chips" id="sort" role="group" aria-label="Sortierung"></div></div>
  <div class="card section"><ul class="cmp" id="cmp"><li class="empty">Lade…</li></ul></div>
  <p class="muted small" id="explain"></p>
</main>
<footer class="site"><span>Daten: DB InfraGO OpenBoards</span><a href="/datenschutz">Datenschutz</a><a href="https://github.com/lmst95/YourPersonalDbDepartureMonitor" rel="noopener">Quellcode</a></footer>
<nav class="bottomnav" aria-label="Navigation">
  <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>Strecken</a>
  <a href="/stations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>Bahnhöfe</a>
  <a href="/stats" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Vergleich</a>
  <a href="/live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 21h10M12 17v4M7 9h4M7 12h7"/></svg>Live</a>
</nav>
<script type="module" src="/static/js/pages/stats.js"></script>
</body>
</html>
